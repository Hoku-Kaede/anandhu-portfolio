:root{
  --paper:#EDEBE6;--sheet:#F4F2ED;--ink:#141414;--muted:#6D6A63;
  --cobalt:#1F3FB0;--rule:rgba(20,20,20,.85);
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter Tight",system-ui,sans-serif;
  --serif:"Inter Tight",system-ui,sans-serif;
  --display:"Monofrik","Inter Tight",ui-monospace,monospace;
  --mono:"Monofrik",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body.dark{
  --paper:#111114;--sheet:#18181d;--ink:#f2efe9;--muted:#9f9b94;
  --cobalt:#a8bcff;--rule:rgba(242,239,233,.82);
}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease)}
#page-veil{position:fixed;inset:0;z-index:200;pointer-events:none;background:var(--paper);clip-path:circle(0 at 50% 50%)}

header{position:fixed;left:0;right:0;top:0;height:76px;padding:0 32px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--rule);background:var(--paper);}
header a{color:inherit;text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
header .idx{color:var(--muted)}
.theme{height:28px;padding:0 12px;border:1px solid var(--rule);background:transparent;color:var(--ink);
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

.hero{position:relative;min-height:0;padding:98px 6vw 26px;display:flex;align-items:flex-start;overflow:hidden}
.hero-in{position:relative;z-index:1;width:100%;max-width:1100px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cobalt)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,8vw,120px);line-height:1.02;letter-spacing:-.01em;margin:12px 0 14px}
.meta{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.content{position:relative;z-index:1;display:grid;grid-template-columns:minmax(240px,360px) minmax(0,1fr);
  gap:clamp(28px,4vw,64px);padding:44px 6vw 64px;align-items:start}
.poster{position:sticky;top:100px;height:min(68vh,620px);width:auto;max-width:100%;aspect-ratio:474/900;object-fit:cover;
  background:var(--sheet);border:1px solid var(--rule);border-radius:2px;justify-self:start}
.copy{max-width:760px}
.syn{font-family:var(--sans);font-size:15px;line-height:1.65;margin:0 0 28px;max-width:70ch;color:var(--ink)}
h2{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:11px;letter-spacing:.02em;color:var(--cobalt);
  background:color-mix(in srgb,var(--cobalt) 9%,transparent);border:1px solid color-mix(in srgb,var(--cobalt) 28%,transparent);
  border-radius:6px;padding:5px 10px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);
  font-size:14px;line-height:1.55}
li::before{content:"";display:none}
li b{font-family:var(--mono,ui-monospace,monospace);font-weight:500;font-size:12px;color:var(--muted);padding-top:2px}
.readme{border:1px solid var(--rule);background:color-mix(in srgb,var(--sheet) 60%,var(--paper));border-radius:8px;overflow:hidden}
.readme-bar{display:flex;align-items:center;gap:12px;height:38px;padding:0 14px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--muted)}
.readme-bar i{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.6;display:block}
.readme-body{padding:28px 30px 30px}
.md-h1{font-family:var(--mono);font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.stroke-heading svg{display:block;width:auto;height:clamp(60px,8vw,118px);max-width:100%;overflow:visible}
#rmtitle svg{height:22px;max-width:100%}
.stroke-heading .st-stroke{fill:none;stroke:var(--cobalt);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.stroke-heading .st-fill{fill:var(--ink)}
.md-h1 em{font-style:normal;color:var(--cobalt)}
.md-h{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--cobalt);
  margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.badges span{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--cobalt);
  border:1px solid color-mix(in srgb,var(--cobalt) 35%,transparent);border-radius:4px;padding:3px 8px;background:color-mix(in srgb,var(--cobalt) 8%,transparent)}
li b{font-family:var(--mono);font-size:11px;color:var(--cobalt)}
.visit{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;margin-top:26px;
  background:var(--cobalt);color:var(--sheet);text-decoration:none;
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.visit.off{background:transparent;color:var(--muted);border:1px solid var(--rule);pointer-events:none}
.visit.alt{background:transparent;color:var(--cobalt);border:1px solid var(--cobalt);margin-left:8px}

.gallery{padding:0 6vw 70px}

/* ---------------- StrokeText (React Bits port, SVG + WAAPI) ---------------- */
var strokeSeq=0;
function StrokeText(el,text,o){
  if(!el) return;
  o=o||{};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var font=o.font||"Newsreader,Georgia,serif";
  var weight=o.weight||400;
  var size=o.size||120;
  var strokeW=o.strokeWidth||1.2;
  var dur=(o.drawDuration||1.4)*1000;
  var stag=(o.stagger||0.055)*1000;
  var fillDelay=(o.fillDelay||0.22)*1000;
  var chars=Array.from(String(text||""));
  function build(){
    var m=document.createElement("canvas").getContext("2d");
    m.font=weight+" "+size+"px "+font;
    var widths=chars.map(function(c){return m.measureText(c).width;});
    var total=widths.reduce(function(a,b){return a+b;},0);
    var pad=size*.14, W=Math.max(1,total+pad*2), H=size*1.35, base=H*.76;
    var ns="http://www.w3.org/2000/svg";
    var id="st-wipe-"+(++strokeSeq);
    var svg=document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMinYMid meet");
    svg.setAttribute("aria-hidden","true");
    var defs=document.createElementNS(ns,"defs");
    var clip=document.createElementNS(ns,"clipPath");
    clip.setAttribute("id",id);clip.setAttribute("clipPathUnits","userSpaceOnUse");
    var rect=document.createElementNS(ns,"rect");
    rect.setAttribute("x","0");rect.setAttribute("y","0");
    rect.setAttribute("height",H);rect.setAttribute("width",reduce?W:0);
    clip.appendChild(rect);defs.appendChild(clip);svg.appendChild(defs);
    var outline=document.createElementNS(ns,"text");
    outline.setAttribute("class","st-stroke");
    outline.setAttribute("stroke-width",strokeW);
    var fill=document.createElementNS(ns,"text");
    fill.setAttribute("class","st-fill");
    fill.setAttribute("clip-path","url(#"+id+")");
    var x=pad, spans=[];
    chars.forEach(function(c,i){
      var w=widths[i];
      var s=document.createElementNS(ns,"tspan");
      s.setAttribute("x",x);s.setAttribute("y",base);
      s.textContent=c===" "?"\u00a0":c;
      var dash=Math.max(1,w+size*1.2);
      s.style.strokeDasharray=dash; s.style.strokeDashoffset=reduce?0:dash;
      outline.appendChild(s);spans.push({node:s,dash:dash});
      var f=document.createElementNS(ns,"tspan");
      f.setAttribute("x",x);f.setAttribute("y",base);
      f.textContent=c===" "?"\u00a0":c;
      fill.appendChild(f);
      x+=w;
    });
    svg.appendChild(outline);svg.appendChild(fill);
    el.innerHTML="";el.appendChild(svg);
    if(reduce) return;
    var anims=[];
    spans.forEach(function(sp,i){
      anims.push(sp.node.animate([{strokeDashoffset:sp.dash},{strokeDashoffset:0}],
        {duration:dur,delay:i*stag,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"}));
    });
    var fd=dur*.6;
    var fi=dur+fillDelay;
    var clipAnim=rect.animate?rect.animate([{width:"0px"},{width:W+"px"}],
      {duration:fd,delay:fi,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"}):null;
    setTimeout(function(){
      anims.forEach(function(a){a.cancel();});
      if(clipAnim) clipAnim.cancel();
      spans.forEach(function(sp){sp.node.style.strokeDashoffset=0;});
      rect.setAttribute("width",W);
    },fi+fd+120);
  }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(build);
  else build();
}

/* ---------------- page transition (same wipe as View project) ---------------- */
var veil=document.getElementById("page-veil");
var lessMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function cornerRadius(){return Math.hypot(Math.max(innerWidth/2,innerWidth/2),Math.max(innerHeight/2,innerHeight/2));}
function enterPage(){
  if(lessMotion) return;
  var R=cornerRadius();
  veil.style.clipPath="circle("+R+"px at 50% 50%)";
  var a=veil.animate([
    {clipPath:"circle("+R+"px at 50% 50%)"},
    {clipPath:"circle(0px at 50% 50%)"}
  ],{duration:520,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});
  setTimeout(function(){a.cancel();veil.style.clipPath="circle(0px at 50% 50%)";},560);
}
function leaveTo(href,el){
  if(lessMotion){location.href=href;return;}
  var r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  var x=r.left+r.width/2, y=r.top+r.height/2;
  var R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  veil.animate([
    {clipPath:"circle(0px at "+x+"px "+y+"px)"},
    {clipPath:"circle("+R+"px at "+x+"px "+y+"px)"}
  ],{duration:460,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});
  setTimeout(function(){location.href=href;},430);
}
enterPage();
[prev,next].forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();leaveTo(this.href,this);});});
addEventListener("keydown",function(e){if(!lb.hidden)return;if(e.key==="ArrowLeft")leaveTo(prev.href,prev);if(e.key==="ArrowRight")leaveTo(next.href,next);});
})();

    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].indexOf(k)>-1)||(e.ctrlKey&&k==='u'))e.preventDefault();
  });
  document.addEventListener('selectstart',function(e){if(!ok(e.target))e.preventDefault();});
  document.addEventListener('dragstart',function(e){if(!ok(e.target))e.preventDefault();});
})();
